<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Review | Review Studio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap');
  :root{--bg:#303d38;--surf:#252425;--surf2:#302f2c;--field:#2b2a27;--line:#46443d;--primary:#c2983d;--primary2:#d9b25a;--green:#81C784;--text:#eceee8;--muted:#928a74}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Lato',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
  header{background:linear-gradient(135deg,#252425,#302f2c);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:900}
  header .who{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center}
  .link{background:none;border:none;color:var(--primary2);cursor:pointer;font-size:12px;font-weight:700}
  .layout{display:flex;height:calc(100vh - 45px);min-height:480px}
  .stage{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .bar{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .btn{background:var(--primary);color:#252425;border:none;border-radius:10px;padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer}
  .btn:hover{background:var(--primary2)}
  .btn.on{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
  .btn.armed{background:#FFF7E8;color:#7D570A}
  .plain{text-decoration:none}
  .pages{flex:1;overflow:auto;padding:24px;display:flex;align-items:flex-start;justify-content:center;background:#1b1a1c}
  .imgwrap{position:relative;display:inline-block;line-height:0;box-shadow:0 6px 24px rgba(0,0,0,.5);border-radius:4px;background:#fff;max-width:100%}
  .imgwrap.commenting{cursor:crosshair}
  #img{display:block;max-width:100%;height:auto;border-radius:4px;-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .players{position:absolute;inset:0;pointer-events:none}
  .pin{position:absolute;transform:translate(-50%,-100%);width:26px;height:26px;border-radius:50% 50% 50% 3px;background:var(--primary);color:#252425;border:2px solid #eceee8;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .pin.done{background:var(--green);color:#2f3a34;border-color:#2f3a34}
  .pin.flash{animation:pinflash 2.2s ease-out}
  @keyframes pinflash{0%,40%{box-shadow:0 0 0 4px var(--primary2),0 2px 8px rgba(0,0,0,.5)}100%{box-shadow:0 2px 8px rgba(0,0,0,.5)}}
  .side{width:340px;flex:none;border-left:1px solid var(--line);background:var(--surf);display:flex;flex-direction:column}
  .side-h{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:900;font-size:14px;display:flex;justify-content:space-between}
  .list{flex:1;overflow:auto;padding:8px 10px}
  .empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:13px;line-height:1.5}
  .cmt{padding:10px;border-radius:12px;cursor:pointer;margin-bottom:6px}
  .cmt:hover{background:var(--surf2)}
  .cmt.done{opacity:.55}
  .cmt.flash{animation:flash 2.2s ease-out}
  @keyframes flash{0%,40%{background:rgba(194,152,61,.28);box-shadow:0 0 0 2px var(--primary2)}100%{background:transparent;box-shadow:none}}
  .cmt-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .badge{background:var(--primary);color:#252425;font-weight:700;font-size:11px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
  .cmt.done .badge{background:var(--green);color:#2f3a34}
  .who-n{font-size:12px;font-weight:700;margin-top:3px}
  .ago{font-size:11px;color:var(--muted)}
  .cmt-body{font-size:13.5px;color:#c2ccc5;margin-top:3px;line-height:1.4;white-space:pre-wrap}
  .cmt-actions{margin-top:6px;display:flex;gap:10px}
  .reply{margin:8px 0 2px 12px;padding:7px 9px;background:rgba(194,152,61,.05);border-left:2px solid var(--line);border-radius:0 8px 8px 0}
  .reply .cmt-body{font-size:12.5px;margin-top:2px}
  .reply .who-n{font-size:11.5px;font-weight:700}
  .reply .cmt-actions{margin-top:4px}
  .statustag{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px}
  .statustag.in_review{background:#eceee8;color:#303d38}
  .statustag.changes{background:#FFF7E8;color:#7D570A}
  .statustag.approved{background:#C8E6C9;color:#18551D}
  .foot{padding:9px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
  .pop{position:fixed;width:300px;background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 44px rgba(18,17,18,.6);padding:12px;z-index:40;display:none}
  .pop.show{display:block}
  textarea{width:100%;min-height:64px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px;color:var(--text);font-size:13px;font-family:inherit;resize:vertical}
  textarea:focus{outline:none;border-color:var(--primary)}
  input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);font-size:14px;font-family:inherit}
  input::placeholder,textarea::placeholder{color:#6f6a5b}
  .pop-a{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
  .scrim{position:fixed;inset:0;background:rgba(28,27,28,.82);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .scrim.show{display:flex}
  .gate{width:380px;max-width:calc(100vw - 40px);background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:0 30px 80px rgba(18,17,18,.7)}
  .gate h2{font-size:19px;margin:0 0 6px;color:#fff}.gate p{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.5}
  .gate input{margin-bottom:10px}.gate .btn{width:100%}
  @media(max-width:820px){ .layout{flex-direction:column;height:auto} .stage{height:70vh} .side{width:100%;border-left:0;border-top:1px solid var(--line)} }
  /* Fullscreen mode: hide chrome + side panel, fit the whole image to the viewport */
  body.fs header{display:none}
  body.fs .layout{height:100vh}
  body.fs .side{display:none}
  body.fs .stage{height:100vh}
  body.fs .bar{position:fixed;top:0;left:0;right:0;z-index:30;background:rgba(0,20,31,.74);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  body.fs .pages{padding:64px 20px 24px;align-items:center;overflow:auto}
  body.fs #img{max-height:calc(100vh - 100px);width:auto;max-width:100%}
/* Studio design-system component signatures */
  .btn,.btn.sm,.btn.on,.btn.ghost,.btn.red,.btn.danger{border-radius:24px}
  input,textarea,select{border-radius:10px}
</style>
</head>
<body>
<header>
  <span class="brandmark" style="font:700 15px/1 system-ui,-apple-system,sans-serif;color:#fff;letter-spacing:.3px"></span><h1 id="title" style="font-size:14px">Image Review</h1>
  <span class="who"><span id="whoName">—</span><button class="link" onclick="askIdentity()">change</button></span>
</header>
<div class="layout">
  <div class="stage">
    <div class="bar">
      <button class="btn" id="addBtn" onclick="armComment()">+ Add comment</button>
      <button class="btn on" id="fsBtn" onclick="toggleFs()">⤢ Fullscreen</button>
      <span id="verWrap" style="display:none;align-items:center;gap:6px">
        <span style="font-size:12px;color:var(--muted);font-weight:700">Version</span>
        <select id="verSel" class="btn on" style="padding:8px 10px;cursor:pointer" onchange="switchVersion(this.value)"></select>
      </span>
      <span class="statustag" id="revStatus" style="display:none"></span>
      <span id="statusBtns" style="display:inline-flex;gap:10px">
        <button class="btn on" onclick="setReviewStatus('changes')">Request changes</button>
        <button class="btn on" onclick="setReviewStatus('approved')">Approve</button>
      </span>
      <span id="verNote" style="display:none;color:#F0C36D;font-size:12.5px;font-weight:700"></span>
      <span id="hint" style="color:var(--muted);font-size:13px">Click <b>+ Add comment</b>, then click the spot on the image.</span>
    </div>
    <div class="pages" id="pages"><div class="empty" style="margin:auto">Loading image…</div></div>
  </div>
  <div class="side">
    <div class="side-h"><span>Comments</span><span id="count" class="ago"></span></div>
    <div class="list" id="list"><div class="empty">Loading…</div></div>
    <div class="foot"><span>Shared</span><button class="link" onclick="load()">refresh</button></div>
  </div>
</div>
<div class="pop" id="pop">
  <div id="popReplyTo" class="ago" style="margin-bottom:8px;display:none">Replying to <b id="popReplyName"></b></div>
  <textarea id="ta" placeholder="What needs to change here?"></textarea>
  <div class="pop-a"><button class="btn on" onclick="closePop()">Cancel</button><button class="btn" id="popPost" onclick="postComment()">Post</button></div>
</div>
<div class="scrim" id="scrim">
  <div class="gate">
    <h2>Sign in to review</h2><p>So the team knows who left each comment. Then click a spot on the image to leave a note.</p>
    <input id="gName" type="text" placeholder="Your name"><input id="gEmail" type="email" placeholder="you@example.com">
    <button class="btn" onclick="saveIdentity()">Start reviewing</button>
    <div id="gErr" style="color:#FF8A7A;font-size:12.5px;margin-top:6px"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
var SUPA_URL=window.APP.supabaseUrl;
var SUPA_KEY=window.APP.supabaseKey;
var H={apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json'};
var params=new URLSearchParams(location.search);
var SRC=params.get('v')||''; var NAME=params.get('name')||'';
var FOCUS=params.get('focus')||'';   // dashboard deep-link: jump to & highlight this comment
var PROJECT=SRC, PAGE='image';
var DATA=[], pending=null, arming=false, imgReady=false;
var REVIEW_ID=null, CUR_V=1, VERSIONS=[], VIEWING_V=1;
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
function ago(iso){var s=Math.max(1,(Date.now()-new Date(iso))/1000);if(s<60)return'just now';var m=s/60;if(m<60)return Math.floor(m)+'m ago';var h=m/60;if(h<24)return Math.floor(h)+'h ago';return Math.floor(h/24)+'d ago';}
function getName(){return localStorage.getItem('idr_name')||'';}
function getEmail(){return localStorage.getItem('idr_email')||'';}
function author(){var n=getName(),e=getEmail();return n?(e?n+' ('+e+')':n):e;}
function updateWho(){ $('whoName').textContent=author()||'not signed in'; }

// ---- image stage -----------------------------------------------------------
function loadImage(){
  var host=$('pages');
  host.innerHTML='<div class="imgwrap" id="wrap"><img id="img" alt="Under review"><div class="players" id="players"></div></div>';
  var img=$('img');
  img.onload=function(){ imgReady=true; renderPins(); maybeFocus(); };
  img.onerror=function(){ host.innerHTML='<div class="empty" style="margin:auto">Could not load this image.<br><span style="font-size:11px">'+esc(SRC)+'</span></div>'; };
  img.src=SRC;
  var wrap=$('wrap');
  if(wrap){
    wrap.addEventListener('click', onStageClick);
    // Deterrent: block right-click "Save image" and drag-to-desktop on the artwork.
    var block=function(e){ e.preventDefault(); return false; };
    wrap.addEventListener('contextmenu', block);
    img.addEventListener('dragstart', block);
  }
}
function onStageClick(e){
  if(!arming) return;
  if(e.target && e.target.classList.contains('pin')) return; // clicking an existing pin isn't a placement
  var img=$('img'); if(!img) return;
  var r=img.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  x=Math.max(0,Math.min(1,x)); y=Math.max(0,Math.min(1,y));
  openComposer({x:x,y:y}, e.clientX, e.clientY);
}
function renderPins(){
  var host=$('players'); if(!host) return;
  var parents=DATA.filter(function(c){return !c.parent_id && c.anchor && c.anchor.type==='image';});
  host.innerHTML=parents.map(function(c,i){
    var a=c.anchor||{}; var n=indexOf(c.id)+1;
    return '<div class="pin'+(c.resolved?' done':'')+'" id="pin-'+c.id+'" style="left:'+((a.x||0)*100)+'%;top:'+((a.y||0)*100)+'%" '
      +'onclick="event.stopPropagation();focusComment(\''+c.id+'\')" title="'+esc((c.author||'')+': '+(c.body||''))+'">'+(c.resolved?'✓':n)+'</div>';
  }).join('');
}
// Stable 1-based number matching the side list order (by position top→bottom).
function orderedParents(){
  return DATA.filter(function(c){return !c.parent_id;}).sort(function(a,b){
    var ay=(a.anchor&&a.anchor.y||0), by=(b.anchor&&b.anchor.y||0);
    return ay-by || (a.anchor&&a.anchor.x||0)-(b.anchor&&b.anchor.x||0);
  });
}
function indexOf(id){ var p=orderedParents(); for(var i=0;i<p.length;i++){ if(String(p[i].id)===String(id)) return i; } return 0; }

// ---- compose / reply -------------------------------------------------------
var replyTo=null, pendingAnchor=null;
function armComment(){
  if(!getEmail()){ askIdentity(); return; }
  arming=!arming;
  var b=$('addBtn'); b.classList.toggle('armed',arming); b.textContent=arming?'Click the image…':'+ Add comment';
  var w=$('wrap'); if(w) w.classList.toggle('commenting',arming);
  $('hint').innerHTML=arming?'Click the spot on the image you want to comment on.':'Click <b>+ Add comment</b>, then click the spot on the image.';
}
function disarm(){ arming=false; var b=$('addBtn'); if(b){b.classList.remove('armed');b.textContent='+ Add comment';} var w=$('wrap'); if(w) w.classList.remove('commenting'); $('hint').innerHTML='Click <b>+ Add comment</b>, then click the spot on the image.'; }
// Fullscreen: maximize the image to fill the viewport so the whole thing is
// visible at once. Pins and click-to-comment keep working (positions are % of
// the image box). Esc exits.
function toggleFs(){
  var on=document.body.classList.toggle('fs');
  var b=$('fsBtn'); if(b) b.textContent=on?'⤢ Exit fullscreen (Esc)':'⤢ Fullscreen';
  renderPins();
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && document.body.classList.contains('fs')) toggleFs(); });
function openComposer(anchor, cx, cy){
  replyTo=null; pending=true; pendingAnchor=anchor;
  $('popReplyTo').style.display='none';
  $('popPost').textContent='Post'; $('ta').placeholder='What needs to change here?';
  showPop(cx, cy); $('ta').value=''; $('ta').focus();
}
function openReply(id){
  if(!getEmail()){ askIdentity(); return; }
  var c=DATA.filter(function(x){return String(x.id)===String(id);})[0]; if(!c) return;
  replyTo=id; pending=true; pendingAnchor=null;
  $('popReplyTo').style.display=''; $('popReplyName').textContent=c.author||'comment';
  $('popPost').textContent='Reply'; $('ta').placeholder='Write a reply…';
  showPop(); $('ta').value=''; $('ta').focus();
}
function showPop(cx, cy){
  var pop=$('pop'); pop.classList.add('show');
  var w=310, h=150;
  var left=(cx!=null?cx+14:24), top=(cy!=null?cy:130);
  left=Math.min(left, window.innerWidth-w); left=Math.max(12,left);
  top=Math.min(top, window.innerHeight-h); top=Math.max(60,top);
  pop.style.left=left+'px'; pop.style.top=top+'px';
}
function postComment(){
  var body=$('ta').value.trim(); if(!body){ $('ta').focus(); return; }
  var c;
  if(replyTo){ c={project:PROJECT,page:PAGE,author:author(),body:body,anchor:null,parent_id:replyTo,resolved:false}; }
  else { c={project:PROJECT,page:PAGE,author:author(),body:body,anchor:{type:'image',x:(pendingAnchor&&pendingAnchor.x)||0,y:(pendingAnchor&&pendingAnchor.y)||0},parent_id:null,resolved:false}; }
  fetch(SUPA_URL+'/rest/v1/review_comments',{method:'POST',headers:Object.assign({Prefer:'return=minimal'},H),body:JSON.stringify([c])})
    .then(function(r){ if(!r.ok)throw new Error(r.status); closePop(); disarm(); load(); })
    .catch(function(e){ alert('Could not post ('+e.message+').'); });
}
function closePop(){ $('pop').classList.remove('show'); pending=null; replyTo=null; pendingAnchor=null; }

// ---- comments list ---------------------------------------------------------
function repliesOf(id){ return DATA.filter(function(c){return String(c.parent_id)===String(id);}).sort(function(a,b){return new Date(a.created_at)-new Date(b.created_at);}); }
function load(){
  fetch(SUPA_URL+'/rest/v1/review_comments?project=eq.'+encodeURIComponent(PROJECT)+'&select=*&order=created_at.asc',{headers:H})
    .then(function(r){return r.ok?r.json():[];})
    .then(function(rows){ DATA=rows||[]; renderList(); renderPins(); maybeFocus(); })
    .catch(function(){ $('list').innerHTML='<div class="empty">Could not load comments.</div>'; });
}
function focusComment(id){
  var node=document.getElementById('c-'+id);
  if(node){ node.classList.remove('flash'); void node.offsetWidth; node.classList.add('flash'); node.scrollIntoView({block:'center',behavior:'smooth'}); }
  var pin=document.getElementById('pin-'+id);
  if(pin){ pin.classList.remove('flash'); void pin.offsetWidth; pin.classList.add('flash'); }
}
function maybeFocus(){
  if(!FOCUS || !imgReady) return;
  var c=DATA.filter(function(x){return String(x.id)===String(FOCUS);})[0]; if(!c) return;
  var top=c.parent_id?(DATA.filter(function(x){return String(x.id)===String(c.parent_id);})[0]||c):c;
  FOCUS=''; focusComment(top.id);
}
function renderList(){
  var parents=orderedParents();
  $('count').textContent=parents.length+' comment'+(parents.length===1?'':'s');
  if(!parents.length){ $('list').innerHTML='<div class="empty">No comments yet. Click <b>+ Add comment</b>, then click the spot on the image.</div>'; return; }
  $('list').innerHTML=parents.map(function(c,i){ var mine=c.author===author();
    var reps=repliesOf(c.id);
    var repHtml=reps.map(function(r){ var rmine=r.author===author();
      return '<div class="reply"><div class="cmt-top"><span class="who-n">'+esc(r.author)+'</span><span class="ago">'+ago(r.created_at)+'</span></div>'
        +'<div class="cmt-body">'+esc(r.body)+'</div>'
        +(rmine?'<div class="cmt-actions"><button class="link" onclick="event.stopPropagation();delc(\''+r.id+'\')">delete</button></div>':'')+'</div>';
    }).join('');
    return '<div class="cmt'+(c.resolved?' done':'')+'" id="c-'+c.id+'" onclick="focusComment(\''+c.id+'\')">'
      +'<div class="cmt-top"><span class="badge">'+(c.resolved?'✓':(i+1))+'</span><span class="ago">'+ago(c.created_at)+'</span></div>'
      +'<div class="who-n">'+esc(c.author)+'</div><div class="cmt-body">'+esc(c.body)+'</div>'
      +repHtml
      +'<div class="cmt-actions" onclick="event.stopPropagation()">'
        +'<button class="link" onclick="openReply(\''+c.id+'\')">reply'+(reps.length?' ('+reps.length+')':'')+'</button>'
        +'<button class="link" onclick="tog(\''+c.id+'\','+(c.resolved?'false':'true')+')">'+(c.resolved?'reopen':'resolve')+'</button>'
        +(mine?'<button class="link" onclick="delc(\''+c.id+'\')">delete</button>':'')+'</div></div>';
  }).join('');
}
function tog(id,v){ fetch(SUPA_URL+'/rest/v1/review_comments?id=eq.'+id,{method:'PATCH',headers:H,body:JSON.stringify({resolved:v})}).then(load); }
function delc(id){ if(!confirm('Delete this comment?'))return; fetch(SUPA_URL+'/rest/v1/review_comments?id=eq.'+id,{method:'DELETE',headers:H}).then(load); }

// ---- review status (approve / request changes) ----
function renderStatus(s){ var el=$('revStatus'); if(!el)return; s=s||'in_review'; el.style.display=''; el.className='statustag '+s; el.textContent=(s==='approved'?'Approved':s==='changes'?'Changes requested':'In review'); }
function statusWord(s){ return s==='approved'?'Approved':s==='changes'?'Changes':'In review'; }
// Resolve this file's review + its version list, then wire up the version switcher.
async function initVersions(){
  var ORIG=SRC, rev=null;
  try{ rev=(await fetch(SUPA_URL+'/rest/v1/reviews?project=eq.'+encodeURIComponent(ORIG)+'&select=id,status,current_v&limit=1',{headers:H}).then(function(r){return r.ok?r.json():[];}))[0]; }catch(e){}
  if(rev){ REVIEW_ID=rev.id; CUR_V=rev.current_v||1; VIEWING_V=CUR_V; renderStatus(rev.status); }
  else {
    // Opened at an older version URL (e.g. a dashboard deep-link) — resolve via the versions table.
    var vr=null;
    try{ vr=(await fetch(SUPA_URL+'/rest/v1/review_versions?url=eq.'+encodeURIComponent(ORIG)+'&select=review_id,v,status&limit=1',{headers:H}).then(function(r){return r.ok?r.json():[];}))[0]; }catch(e){}
    if(vr){ REVIEW_ID=vr.review_id; VIEWING_V=vr.v; renderStatus(vr.status);
      try{ var rr=(await fetch(SUPA_URL+'/rest/v1/reviews?id=eq.'+REVIEW_ID+'&select=current_v&limit=1',{headers:H}).then(function(r){return r.ok?r.json():[];}))[0]; if(rr) CUR_V=rr.current_v||VIEWING_V; }catch(e){}
    }
  }
  if(!REVIEW_ID) return;
  try{ VERSIONS=await fetch(SUPA_URL+'/rest/v1/review_versions?review_id=eq.'+REVIEW_ID+'&select=v,url,status&order=v.asc',{headers:H}).then(function(r){return r.ok?r.json():[];}); }catch(e){ VERSIONS=[]; }
  buildVerSel(); reflectVersionUI();
}
function buildVerSel(){
  var wrap=$('verWrap'), sel=$('verSel'); if(!wrap||!sel) return;
  if(!VERSIONS || VERSIONS.length<2){ wrap.style.display='none'; return; }
  wrap.style.display='inline-flex';
  sel.innerHTML=VERSIONS.map(function(v){
    return '<option value="'+v.v+'"'+(v.v===VIEWING_V?' selected':'')+'>'+esc('v'+v.v+(v.v===CUR_V?' (current)':'')+' · '+statusWord(v.status))+'</option>';
  }).join('');
}
function reflectVersionUI(){
  var older=(VIEWING_V!==CUR_V);
  var note=$('verNote'), sb=$('statusBtns');
  if(note){ note.style.display=older?'':'none'; if(older) note.textContent='Viewing v'+VIEWING_V+' — older version (current is v'+CUR_V+')'; }
  if(sb) sb.style.display=older?'none':'inline-flex';
}
function switchVersion(v){
  v=parseInt(v,10); var ver=VERSIONS.filter(function(x){return x.v===v;})[0]; if(!ver) return;
  VIEWING_V=v; SRC=ver.url; PROJECT=ver.url;
  var oo=$('openOrig'); if(oo) oo.href=SRC;
  imgReady=false; disarm(); renderStatus(ver.status);
  loadImage(); load(); reflectVersionUI();
}
function setReviewStatus(val){
  if(!getEmail()){ askIdentity(); return; }
  if(VIEWING_V!==CUR_V){ alert('Switch to the current version (v'+CUR_V+') to change its status.'); return; }
  renderStatus(val);
  if(REVIEW_ID){
    if(VERSIONS&&VERSIONS.length){ fetch(SUPA_URL+'/rest/v1/review_versions?review_id=eq.'+REVIEW_ID+'&v=eq.'+CUR_V,{method:'PATCH',headers:H,body:JSON.stringify({status:val})}); var vv=VERSIONS.filter(function(x){return x.v===CUR_V;})[0]; if(vv) vv.status=val; buildVerSel(); }
    fetch(SUPA_URL+'/rest/v1/reviews?id=eq.'+REVIEW_ID,{method:'PATCH',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify({status:val})})
      .then(function(r){ if(!r.ok) alert('Could not set status ('+r.status+').'); });
  } else {
    fetch(SUPA_URL+'/rest/v1/reviews?project=eq.'+encodeURIComponent(PROJECT),{method:'PATCH',headers:Object.assign({'Content-Type':'application/json',Prefer:'return=representation'},H),body:JSON.stringify({status:val})})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(rows){ if(!rows||!rows.length){ alert('This image isn’t in the Review Library yet, so its status can’t be saved. Add it via the Library first.'); } })
      .catch(function(e){ alert('Could not set status ('+e.message+').'); });
  }
}
function askIdentity(){ $('gName').value=getName(); $('gEmail').value=getEmail(); $('scrim').classList.add('show'); setTimeout(function(){$('gName').focus();},30); }
function saveIdentity(){ var n=$('gName').value.trim(),e=$('gEmail').value.trim(); if(!n){$('gErr').textContent='Enter your name.';return;} if(!/.+@.+\..+/.test(e)){$('gErr').textContent='Enter a valid email.';return;} localStorage.setItem('idr_name',n); localStorage.setItem('idr_email',e); $('scrim').classList.remove('show'); updateWho(); }

if(NAME){ $('title').textContent=NAME+' — Image Review'; document.title=NAME+' | Image Review'; }
updateWho();
if(SRC){ var oo=$('openOrig'); if(oo) oo.href=SRC; } else { var oo2=$('openOrig'); if(oo2) oo2.style.display='none'; }
if(!getEmail()) askIdentity();
if(SRC) loadImage(); else $('pages').innerHTML='<div class="empty" style="margin:auto">No image specified.</div>';
if(SRC) initVersions();
load();
setInterval(load,6000);
window.addEventListener('resize',renderPins);
</script>
</body>
</html>
